apiVersion: v1
kind: Secret
metadata:
  name: work-report-secrets
  namespace: work-report
type: Opaque
stringData:
  # Ganti dengan nilai kredensial sebenarnya saat deploy
  APP_KEY: "base64:YOUR_GENERATED_APP_KEY_HERE="
  DB_USERNAME: "root"
  DB_PASSWORD: "YOUR_SECURE_DB_PASSWORD"
  REDIS_PASSWORD: ""
  
  # Web Push Notifications (Opsional)
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: "mailto:admin@ptmsn.co.id"
