apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-report-app
  namespace: work-report
  labels:
    app: work-report-app
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero-downtime deployment guarantee
  selector:
    matchLabels:
      app: work-report-app
  template:
    metadata:
      labels:
        app: work-report-app
        tier: frontend
    spec:
      containers:
        - name: app
          image: ptmsn/work-report:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: work-report-config
            - secretRef:
                name: work-report-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # Kubernetes Health Probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: storage-volume
              mountPath: /var/www/html/storage/app/public
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: work-report-storage-pvc
