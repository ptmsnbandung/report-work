apiVersion: v1
kind: ConfigMap
metadata:
  name: work-report-config
  namespace: work-report
data:
  APP_NAME: "PT MSN Work Report"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://work-report.ptmsn.co.id"
  APP_TIMEZONE: "Asia/Jakarta"
  APP_LOCALE: "id"

  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  # Database Host & Port (Can point to external RDS or in-cluster MySQL)
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql.work-report.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "work_report"

  # Redis for High Speed Distributed Session, Cache, and Queue
  SESSION_DRIVER: "redis"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis.work-report.svc.cluster.local"
  REDIS_PORT: "6379"

  # Storage Configuration
  FILESYSTEM_DISK: "public"
